<style>
  :root{
    --bg-deep:#070504;
    --bg-mid:#17110a;
    --red:#3a2a10;
    --red-deep:#0e0a05;
    --gold:#d4af37;
    --gold-bright:#f3d576;
    --gold-dim:#8a6a2c;
    --cream:#f4e6c8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{
    background:var(--bg-deep);
    min-height:100%;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(circle at 50% 8%, #2a1d0c 0%, transparent 45%),
      radial-gradient(ellipse at 50% 115%, #22190b 0%, var(--bg-deep) 55%),
      linear-gradient(180deg, var(--bg-deep), #030201);
    color:var(--cream);
    font-family:'Cairo', sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    overflow-x:clip;
    position:relative;
    padding:96px 16px 190px;
  }

  /* subtle hieroglyph texture drifting across background */
  body::before{
    content:"";
    position:fixed; inset:-10% -10%;
    opacity:.05;
    background-image: radial-gradient(var(--gold) 1px, transparent 1.4px);
    background-size: 26px 26px;
    animation: drift 40s linear infinite;
    pointer-events:none;
  }
  @keyframes drift{
    0%{ transform:translate(0,0); }
    100%{ transform:translate(-26px,-26px); }
  }

  .brand{
    position:absolute; top:44px; right:24px; z-index:6; cursor:pointer; padding:8px;
    font-family:'Aref Ruqaa', serif; font-size:1.5rem; color:var(--gold-bright);
    display:flex; align-items:center; gap:10px;
  }
  .brand-logo{ width:40px; height:40px; border-radius:50%; display:block;
    box-shadow:0 0 0 1px rgba(212,175,55,.55), 0 4px 14px rgba(0,0,0,.6); }
  .brand .dot{
    width:8px; height:8px; border-radius:50%; background:#ff5b5b;
    box-shadow:0 0 8px #ff5b5b;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  /* the cartouche card */
  .cartouche{
    position:relative; z-index:2; margin:auto 0;
    width:min(430px, 92vw);
    padding:44px 30px 34px;
    border-radius:28px;
    background:linear-gradient(180deg, #1a130a, #0b0805 70%);
    border:1px solid rgba(212,175,55,.35);
    box-shadow:
      0 40px 90px rgba(0,0,0,.6),
      inset 0 0 0 6px rgba(212,175,55,.05),
      inset 0 0 40px rgba(212,175,55,.06);
    text-align:center;
  }
  /* ornamental corners */
  .cartouche::before, .cartouche::after,
  .corner-bl, .corner-br{
    content:""; position:absolute; width:26px; height:26px;
    border:2px solid var(--gold);
    opacity:.75;
  }
  .cartouche::before{ top:10px; right:10px; border-left:none; border-bottom:none; border-radius:0 8px 0 0; }
  .cartouche::after{ top:10px; left:10px; border-right:none; border-bottom:none; border-radius:8px 0 0 0; }
  .corner-bl{ bottom:10px; left:10px; border-right:none; border-top:none; border-radius:0 0 0 8px; }
  .corner-br{ bottom:10px; right:10px; border-left:none; border-top:none; border-radius:0 0 8px 0; }

  .live-badge{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(212,175,55,.12);
    border:1px solid rgba(212,175,55,.4);
    padding:4px 14px; border-radius:999px;
    font-size:.72rem; color:var(--gold-bright); letter-spacing:1px;
    margin-bottom:16px;
  }
  .live-badge i{ width:6px; height:6px; border-radius:50%; background:#ff5b5b; box-shadow:0 0 6px #ff5b5b; animation:pulse 1.6s ease-in-out infinite; }

  .eyebrow{ font-size:.8rem; letter-spacing:4px; color:var(--gold); text-transform:uppercase; }
  h1{ font-family:'Aref Ruqaa', serif; font-size:2.3rem; margin:10px 0 6px; text-shadow:0 2px 12px rgba(212,175,55,.25); }
  .sub{ color:#e2c9a9; opacity:.75; font-size:.9rem; margin-bottom:30px; }

  /* sun-disc dial */
  .dial-wrap{ position:relative; width:206px; height:206px; margin:0 auto 54px; }
  .rays{
    position:absolute; inset:0; border-radius:50%;
    background:
      repeating-conic-gradient(from 0deg, rgba(212,175,55,.35) 0deg 4deg, transparent 4deg 18deg);
    -webkit-mask:radial-gradient(circle, transparent 62%, #000 64%);
            mask:radial-gradient(circle, transparent 62%, #000 64%);
    animation:none;
  }
  body.playing .rays{ animation:spin 12s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .rings{ position:absolute; inset:18px; border-radius:50%; border:1px solid rgba(212,175,55,.3); }
  .rings::before{ content:""; position:absolute; inset:14px; border-radius:50%; border:1px solid rgba(212,175,55,.18); }

  #playBtn{
    position:absolute; inset:56px; border-radius:50%; border:none; cursor:pointer;
    background:
      radial-gradient(circle at 33% 28%, var(--red) 0%, var(--red-deep) 75%);
    box-shadow:
      0 14px 30px rgba(212,175,55,.28),
      inset 0 2px 8px rgba(255,220,150,.25),
      0 0 0 3px rgba(212,175,55,.5);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  #playBtn:active{ transform:scale(.94); }
  #playBtn svg{ width:44px; height:44px; fill:var(--gold-bright); }

  .bars{
    position:absolute; bottom:-40px; left:50%; transform:translateX(-50%);
    display:flex; gap:5px; align-items:flex-end; height:22px;
  }
  .bars i{ width:4px; background:linear-gradient(180deg, var(--gold-bright), var(--gold-dim)); border-radius:2px; height:6px; transition:height .5s ease-in-out; }

  .status{ font-size:.96rem; color:var(--gold-bright); min-height:22px; margin-bottom:8px; }
  .station-name{ font-size:1.08rem; font-weight:800; }
  .freq{ font-size:.8rem; color:#d9b98d; margin-top:4px; opacity:.85; }

  .divider{
    margin:26px 0 18px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(212,175,55,.55), transparent);
  }
  footer{ font-size:.72rem; color:#c9a679; opacity:.8; }

  #telegramBtn{
    --tg:#2AABEE; --tg-glow: rgba(42,171,238,.65);
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:18px auto 0; width:max-content;
    background:rgba(42,171,238,.06); border:1px solid var(--tg); color:var(--tg);
    font-family:'Cairo', sans-serif; font-size:13px; font-weight:700;
    padding:9px 20px; border-radius:999px; text-decoration:none;
    text-shadow:0 0 6px var(--tg-glow), 0 0 14px var(--tg-glow);
    box-shadow:0 0 10px rgba(42,171,238,.35), inset 0 0 10px rgba(42,171,238,.12);
    transition: transform .15s, box-shadow .2s;
  }
  #telegramBtn svg{ filter:drop-shadow(0 0 5px var(--tg-glow)); }
  #telegramBtn:active{ transform:scale(.96); }
  #telegramBtn:focus-visible{ outline:2px solid var(--tg); outline-offset:2px; }

  /* Cairo skyline silhouette fixed at bottom */
  .skyline{
    position:fixed; left:0; right:0; bottom:0; height:150px; z-index:1;
    pointer-events:none;
  }
  .skyline svg{ width:100%; height:100%; display:block; }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>

<script>
  // نفس المحطة (radiojar) بأكثر من مدخل. لو واحد فشل في WebView تيليجرام نجرّب اللي بعده.
  // لو عملت proxy على سيرفرك/Worker حط رابطه هنا وهيتجرّب الأول (سيبه فاضي لو مفيش)
  const PROXY_URL = 'https://moamen.wisp.uno/stream';
  const STREAMS = (PROXY_URL ? [PROXY_URL] : []).concat([
    'https://stream.radiojar.com/8s5u5tpdtwzuv',
    'https://n12.radiojar.com/8s5u5tpdtwzuv',
    'https://n12.radiojar.com/8s5u5tpdtwzuv?rj-ttl=5'
  ]);
  let streamIdx = 0;
  const MAX_RETRIES = STREAMS.length * 2;   // لفّتين على كل المداخل

  let audio = document.getElementById('radio');
  const btn = document.getElementById('playBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const status = document.getElementById('status');
  const barEls = document.querySelectorAll('.bars i');

  let wantPlay = false;      // user intent
  let retries = 0;
  let retryTimer = null;
  let barsTimer = null;
  let connected = false;     // true only after the stream actually started playing

  // ---- debug log: open the Mini App with ?startapp=debug (or ?debug in a browser) ----
  const tgApp = window.Telegram && window.Telegram.WebApp;
  let DEBUG = /[?&#]debug/.test(location.href) ||
                !!(tgApp && tgApp.initDataUnsafe && tgApp.initDataUnsafe.start_param === 'debug');
  let dbgEl = null;
  const VERSION = 'v5';
  (function(){
    const brand = document.querySelector('.brand');
    let taps = 0, t0 = 0;
    if(brand) brand.addEventListener('click', ()=>{
      const now = Date.now();
      taps = (now - t0 > 2500) ? 1 : taps + 1; t0 = now;
      if(taps >= 5){ taps = 0; DEBUG = true; log('debug on, ' + VERSION + ', ' + navigator.userAgent); }
    });
  })();
  function log(msg){
    if(!DEBUG) return;
    if(!dbgEl){
      dbgEl = document.createElement('pre');
      dbgEl.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:38vh;overflow:auto;margin:0;padding:6px 8px;background:rgba(0,0,0,.85);color:#9f9;font:11px/1.35 monospace;z-index:99;direction:ltr;text-align:left;white-space:pre-wrap';
      document.body.appendChild(dbgEl);
    }
    dbgEl.textContent += new Date().toISOString().slice(14,23) + ' ' + msg + '\n';
    dbgEl.scrollTop = dbgEl.scrollHeight;
  }

  function randomizeBars(){
    barEls.forEach(bar=>{ bar.style.height = (5 + Math.random() * 20) + 'px'; });
  }
  function startBars(){
    if(barsTimer) return;
    randomizeBars();
    barsTimer = setInterval(randomizeBars, 650);
  }
  function stopBars(){
    clearInterval(barsTimer);
    barsTimer = null;
    barEls.forEach(bar=> bar.style.height = '6px');
  }

  function setUI(state, msg){
    const on = (state === 'playing' || state === 'loading');
    document.body.classList.toggle('playing', state === 'playing');
    iconPlay.style.display  = on ? 'none'  : 'block';
    iconPause.style.display = on ? 'block' : 'none';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if(state === 'playing') startBars(); else stopBars();
    status.textContent = msg || '';
  }

  // ---- مسار بديل: نجيب البث بـ fetch ونغذّي به MediaSource (لو عنصر audio رفض الرابط مباشرة) ----
  let useMse = false, triedMse = false, mseAbort = null, mseUrl = null;
  function cleanupMse(){
    if(mseAbort){ try{ mseAbort.abort(); }catch(e){} mseAbort = null; }
    if(mseUrl){ try{ URL.revokeObjectURL(mseUrl); }catch(e){} mseUrl = null; }
  }

  function connectMse(base){
    const a = audio;
    const ac = new AbortController();
    mseAbort = ac;
    const ms = new MediaSource();
    mseUrl = URL.createObjectURL(ms);
    a.src = mseUrl;
    ms.addEventListener('sourceopen', async ()=>{
      if(a !== audio || ac.signal.aborted) return;
      let sb;
      try{
        sb = ms.addSourceBuffer('audio/mpeg');
        sb.mode = 'sequence';
      }catch(e){ log('mse addSourceBuffer failed: ' + e.name); return handleFailure(); }

      const queue = [];
      const trim = ()=>{
        try{
          if(!sb.updating && sb.buffered.length && a.currentTime > 40){
            sb.remove(0, a.currentTime - 20);   // نحتفظ بآخر ~20 ثانية بس عشان الذاكرة
            return true;
          }
        }catch(e){}
        return false;
      };
      const pump = ()=>{
        if(sb.updating || !queue.length || ms.readyState !== 'open') return;
        const chunk = queue.shift();
        try{ sb.appendBuffer(chunk); }
        catch(e){
          if(e.name === 'QuotaExceededError'){ queue.unshift(chunk); trim(); }
          else { log('mse append failed: ' + e.name); handleFailure(); }
        }
      };
      sb.addEventListener('updateend', ()=>{ if(a !== audio) return; if(!trim()) pump(); });

      try{
        const r = await fetch(base, {cache:'no-store', referrerPolicy:'no-referrer', signal:ac.signal});
        if(!r.ok || !r.body) throw new Error('HTTP ' + r.status);
        log('mse fetch ok type=' + r.headers.get('content-type'));
        const reader = r.body.getReader();
        while(true){
          const {done, value} = await reader.read();
          if(done) break;
          if(a !== audio || ac.signal.aborted) return;
          queue.push(value);
          if(queue.length > 300) queue.splice(0, queue.length - 150);   // حماية من تراكم لو الجهاز بطيء
          pump();
        }
        if(a === audio && !ac.signal.aborted){ log('mse stream ended'); handleFailure(); }
      }catch(e){
        if(ac.signal.aborted || a !== audio) return;
        log('mse fetch failed: ' + e.name + ' ' + e.message);
        if(e.name === 'TypeError') retries = MAX_RETRIES;   // فشل شبكة من جوه الـ WebView: التكرار مش هيفرق
        handleFailure();
      }
    }, {once:true});
  }

  function makeAudio(){
    cleanupMse();
    // عنصر audio جديد في كل محاولة: بعد MEDIA_ELEMENT_ERROR بعض الـ WebViews بيفضل عنصر الصوت في حالة بايظة
    if(audio){
      const old = audio;
      audio = null;                 // أحداث العنصر القديم تتجاهل نفسها
      try{ old.pause(); old.removeAttribute('src'); old.load(); old.remove(); }catch(e){}
    }
    const a = document.createElement('audio');
    a.id = 'radio';
    a.preload = 'none';
    a.setAttribute('playsinline', '');
    document.body.appendChild(a);
    audio = a;
    bind(a);
  }

  function bind(a){
    const mine = fn => (...args) => { if(a === audio) fn(...args); };
    a.addEventListener('playing', mine(()=>{
      retries = 0;
      connected = true;
      clearFallback();
      setUI('playing', 'يُبث الآن مباشرة');
    }));
    a.addEventListener('waiting', mine(()=>{ if(wantPlay) setUI('loading', 'جاري التحميل...'); }));
    a.addEventListener('stalled', mine(()=>{ if(wantPlay) setUI('loading', 'ضعف في الاتصال...'); }));
    a.addEventListener('error',   mine(()=>{
      const e = a.error;
      log('event error code=' + (e && e.code) + ' msg=' + (e && e.message) + ' url=' + a.currentSrc);
      handleFailure();
    }));
    a.addEventListener('ended', mine(handleFailure));   // البث المباشر مفروض ما يخلصش
    // إيقاف من برّه الصفحة (سماعات اتشالت، مكالمة، أزرار النظام)
    a.addEventListener('pause', mine(()=>{
      log('event pause connected=' + connected);
      if(wantPlay && connected && !a.ended) stop(undefined, 'external-pause');
    }));
    ['loadstart','loadedmetadata','canplay','play','waiting','stalled','suspend','abort','emptied']
      .forEach(ev => a.addEventListener(ev, mine(()=> log('event ' + ev + ' ready=' + a.readyState + ' net=' + a.networkState))));
  }

  let probed = false;
  async function probe(url){
    if(probed || !DEBUG) return;
    probed = true;
    try{
      const ac = new AbortController();
      const r = await fetch(url, {mode:'cors', cache:'no-store', referrerPolicy:'no-referrer', signal:ac.signal});
      log('probe cors: HTTP ' + r.status + ' type=' + r.headers.get('content-type') + ' final=' + r.url);
      ac.abort();
    }catch(e){
      log('probe cors failed: ' + e.name);
      try{
        const ac2 = new AbortController();
        await fetch(url, {mode:'no-cors', cache:'no-store', referrerPolicy:'no-referrer', signal:ac2.signal});
        log('probe no-cors: ok (يعني المشكلة CORS بس)');
        ac2.abort();
      }catch(e2){ log('probe no-cors failed: ' + e2.name + ' (مش CORS: الطلب نفسه بيفشل جوه الـ WebView)'); }
    }
  }

  function connect(){
    clearTimeout(retryTimer);
    retryTimer = null;
    connected = false;
    makeAudio();
    const base = STREAMS[streamIdx % STREAMS.length];
    const url = base;
    log('connect() #' + streamIdx + ' ' + base);
    probe(base);
    if(useMse){ connectMse(url); }
    else { audio.src = url; audio.load(); }
    const p = audio.play();
    if(p && p.catch) p.catch(err=>{
      log('play() rejected: ' + (err && err.name));
      if(err && err.name === 'AbortError') return;   // حصل بسبب load/stop، مش فشل حقيقي
      handleFailure();
    });
  }

  function handleFailure(){
    if(!wantPlay) return;
    if(retryTimer) return;            // فشل واحد بيطلع أكتر من حدث (error + play reject): نعدّه مرة
    if(retries >= STREAMS.length && !triedMse && window.MediaSource && MediaSource.isTypeSupported('audio/mpeg')){
      triedMse = true; useMse = true;
      log('switching to MediaSource path');
    }
    if(retries >= MAX_RETRIES){
      stop('تعذر تشغيل البث داخل تيليجرام', 'retries-exhausted');
      showFallback();
      return;
    }
    retries++;
    streamIdx++;                      // جرّب المدخل التالي
    setUI('loading', 'جاري إعادة الاتصال...');
    const delay = useMse ? 1500 : 600;
    retryTimer = setTimeout(connect, delay);
  }

  // آخر حل: فتح الصفحة في متصفح الجهاز لو WebView تيليجرام رفض كل المداخل
  let fbEl = null;
  function showFallback(){
    if(fbEl) return;
    fbEl = document.createElement('button');
    fbEl.type = 'button';
    fbEl.textContent = 'شغّل البث في المتصفح';
    fbEl.style.cssText = 'margin:10px auto 0;display:block;padding:10px 22px;border-radius:999px;border:1px solid #c9a24a;background:transparent;color:#e8c872;font:600 15px Cairo,sans-serif;cursor:pointer';
    fbEl.addEventListener('click', ()=>{
      const u = STREAMS[0];
      try{ if(tgApp && tgApp.openLink) return tgApp.openLink(u); }catch(e){}
      window.open(u, '_blank');
    });
    status.insertAdjacentElement('afterend', fbEl);
  }
  function clearFallback(){ if(fbEl){ fbEl.remove(); fbEl = null; } }

  function start(){
    wantPlay = true;
    retries = 0;
    useMse = false; triedMse = false;
    clearFallback();
    setUI('loading', 'جاري الاتصال بالبث...');
    connect();
  }

  function stop(msg, why){
    log('stop() by ' + (why || 'unknown'));
    wantPlay = false;
    clearTimeout(retryTimer);
    retryTimer = null;
    cleanupMse();
    if(audio){
      const a = audio;
      audio = null;                    // يمنع أحداث pause/emptied من إعادة تشغيل منطق الفشل
      try{ a.pause(); a.removeAttribute('src'); a.load(); a.remove(); }catch(e){}
    }
    setUI('idle', msg || 'تم الإيقاف');
  }

  btn.addEventListener('click', ()=>{ log('click wantPlay=' + wantPlay); wantPlay ? stop(undefined, 'user-click') : start(); });

  // lock-screen / notification controls
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'إذاعة القرآن الكريم',
      artist: 'القاهرة — بث مباشر',
      album: 'ملاذ',
      artwork: [{ src: document.querySelector('.brand-logo').src, sizes: '128x128', type: 'image/webp' }]
    });
    navigator.mediaSession.setActionHandler('play',  start);
    navigator.mediaSession.setActionHandler('pause', ()=> stop(undefined, 'mediasession-pause'));
    navigator.mediaSession.setActionHandler('stop',  ()=> stop(undefined, 'mediasession-stop'));
  }
  // ---- Telegram Mini App integration (safe no-op outside Telegram) ----
  (function(){
    const tg = window.Telegram && window.Telegram.WebApp;
    if(!tg) return;
    try{ tg.ready(); }catch(e){}
    try{ tg.expand(); }catch(e){}
    try{ if(tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); }catch(e){}
    try{
      if(tg.isVersionAtLeast('6.1')){
        tg.setHeaderColor('#070504');
        tg.setBackgroundColor('#070504');
      }
      if(tg.isVersionAtLeast('7.10')) tg.setBottomBarColor('#030201');
    }catch(e){}
    // open t.me links natively instead of a new browser tab
    if(tg.initData){
      document.querySelectorAll('a[href^="https://t.me/"]').forEach(a=>{
        a.addEventListener('click', ev=>{
          ev.preventDefault();
          try{ tg.openTelegramLink(a.href); }catch(e){ window.open(a.href, '_blank'); }
        });
      });
    }
  })();
</script>
</body>
